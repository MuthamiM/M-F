version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: mf-postgres
    restart: always
    environment:
      - POSTGRES_DB=mf_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_secure_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - mf-network

  adminer:
    image: adminer:latest
    container_name: mf-adminer
    restart: always
    ports:
      # Bind Adminer to localhost so Nginx can reverse proxy it securely
      - "127.0.0.1:8080:8080"
    networks:
      - mf-network

  redis:
    image: redis:7-alpine
    container_name: mf-redis
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - mf-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mf-backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - PORT=4000
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/mf_db
      - NODE_ENV=production
      - ALLOWED_ORIGINS=http://${DOMAIN:-mftechnologies.org},https://${DOMAIN:-mftechnologies.org},http://www.${DOMAIN:-mftechnologies.org},https://www.${DOMAIN:-mftechnologies.org},https://mftechnologies.org,http://mftechnologies.org,https://www.mftechnologies.org,http://www.mftechnologies.org,http://18.188.142.27,https://18.188.142.27,http://localhost:3000,http://127.0.0.1:3000
      - JWT_SECRET=${JWT_SECRET:-production_fallback_secret_please_change}
      - JWT_EXPIRES_IN=7d
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      - postgres
      - redis
    networks:
      - mf-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mf-frontend
    restart: always
    environment:
      - PORT=3000
      - BACKEND_INTERNAL_URL=http://backend:4000
      - NODE_ENV=production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks:
      - mf-network

volumes:
  postgres-data:
  redis-data:

networks:
  mf-network:
    driver: bridge
