version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: mf-redis
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - mf-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mf-backend
    restart: always
    environment:
      - PORT=4000
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - ALLOWED_ORIGINS=https://mandftechnologies.com,https://www.mandftechnologies.com,http://localhost:3000
      - JWT_SECRET=${JWT_SECRET:-production_fallback_secret_please_change}
      - JWT_EXPIRES_IN=7d
    volumes:
      - backend-data:/app/data
    ports:
      # Keep backend port private to the VPS host loopback interface
      - "127.0.0.1:4000:4000"
    depends_on:
      - redis
    networks:
      - mf-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mf-frontend
    restart: always
    environment:
      - PORT=3000
      - BACKEND_INTERNAL_URL=http://backend:4000
      - NODE_ENV=production
    ports:
      # Bind to localhost so only Nginx reverse proxy on the host can access it
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks:
      - mf-network

volumes:
  redis-data:
  backend-data:

networks:
  mf-network:
    driver: bridge
